name: Deploy to cPanel (ufuqoman.com)

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Deploy site via FTP
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code from main branch
        uses: actions/checkout@v4

      - name: 📂 Sync files to cPanel public_html
        uses: SamKirsch/ftp-deploy-action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /public_html/
          # Exclude git configuration and admin source files if you prefer, or sync everything:
          exclude: |
            **/.git/**
            **/node_modules/**
            **/.github/**
            **/README.md